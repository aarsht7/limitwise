name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-14
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: plugins/limitwise
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        if: runner.os == 'macOS'
        with:
          targets: ${{ matrix.target }}
      - name: Test and build Linux with stable Rust against GLIBC 2.31
        if: runner.os == 'Linux'
        run: |
          docker run --rm \
            -e TARGET="${{ matrix.target }}" \
            -v "$PWD:/work" \
            -w /work \
            rust:bullseye \
            sh -c 'rustup target add "$TARGET" && cargo test --locked --all --target "$TARGET" && cargo build --locked --release --target "$TARGET"'
      - name: Verify Linux GLIBC baseline
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          binary="target/${{ matrix.target }}/release/limitwise"
          required_glibc="$(readelf --version-info "$binary" | grep -oE 'GLIBC_[0-9]+(\.[0-9]+)*' | sort -Vu | tail -n 1)"
          baseline_glibc="GLIBC_2.31"
          test -n "$required_glibc"
          if [ "$(printf '%s\n%s\n' "$required_glibc" "$baseline_glibc" | sort -V | tail -n 1)" != "$baseline_glibc" ]; then
            echo "Linux release requires $required_glibc; maximum supported baseline is $baseline_glibc" >&2
            exit 1
          fi
          echo "Linux release GLIBC requirement: $required_glibc"
      - name: Test macOS
        if: runner.os == 'macOS'
        run: cargo test --locked --all
      - name: Build macOS
        if: runner.os == 'macOS'
        run: cargo build --locked --release --target "${{ matrix.target }}"
      - run: ./scripts/package-release.sh "${{ matrix.target }}" dist
      - uses: actions/upload-artifact@v7
        with:
          name: limitwise-${{ matrix.target }}
          path: plugins/limitwise/dist/*.tar.gz

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate installer
        run: sh -n install.sh
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create checksums
        working-directory: dist
        run: sha256sum -- *.tar.gz > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
            install.sh
          body: "Compatibility warning: LimitWise has only been tested on Linux x86-64. macOS, including Apple Silicon, and other architectures are untested."
