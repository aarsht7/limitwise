[package]
name = "limitwise"
version = "0.5.0"
edition = "2021"
rust-version = "1.71"
description = "Quota-aware one-off scheduler for Codex"
license = "MIT"

[dependencies]
chrono = { version = "0.4.31", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.8.4"
libc = "0.2.147"
rusqlite = { version = "0.29.0", features = ["bundled"] }
serde = { version = "1.0.188", features = ["derive"] }
serde_json = "1.0.107"

[profile.release]
strip = true
lto = true
codegen-units = 1
