<!doctype html>
<html lang="{{ site.lang | default: 'en' }}" data-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#080b12">
    <meta name="color-scheme" content="dark light">
    <title>{% if page.title == site.title %}{{ site.title }}{% else %}{{ page.title }} · {{ site.title }}{% endif %}</title>
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("limitwise-theme") === "light" ? "light" : "dark";
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
        } catch (_) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>

    <header class="site-header">
      <div class="site-header-inner">
        <a class="brand-lockup" href="{{ '/' | relative_url }}" aria-label="LimitWise documentation home">
          <span class="brand-mark" aria-hidden="true">LW</span>
          <span class="brand-copy">
            <strong>LimitWise</strong>
            <small>Quota-aware Codex scheduling</small>
          </span>
        </a>

        <div class="theme-switch" role="group" aria-label="Color theme">
          <button type="button" data-theme-choice="dark" aria-pressed="true">Dark</button>
          <button type="button" data-theme-choice="light" aria-pressed="false">Light</button>
        </div>
      </div>
    </header>

    <main id="main-content" class="main-content" role="main">
      {{ content }}
    </main>

    <footer class="site-footer">
      <span>LimitWise documentation</span>
      <a href="{{ '/ARCHITECTURE.html' | relative_url }}">Architecture</a>
    </footer>

    <script src="{{ '/assets/js/theme.js' | relative_url }}" defer></script>
  </body>
</html>
